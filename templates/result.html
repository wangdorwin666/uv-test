<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>推荐结果 - 小说推荐器</title>
  <style>
    body { font-family: Arial, "Microsoft YaHei"; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    pre.report { background:#f6f8fa; padding:12px; white-space:pre-wrap; }
    a.back { display:inline-block; margin-top:12px; }
  </style>
</head>
<body>
  <h1>题材：{{ genre }}</h1>
  {% if preferences %}
    <p>偏好：{{ preferences }}</p>
  {% endif %}
  <h2>推荐报告</h2>
  <pre class="report">{{ report }}</pre>

  <a class="back" href="/">← 返回并修改题材</a>
</body>
</html>
